title: Kalo
description: Open Custom Content Engine for Minecraft
baseurl: "/kalo"
url: "https://cyoriasmp-team.github.io"

remote_theme: just-the-docs/just-the-docs@v0.10.0

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

color_scheme: dark

permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/CyoriaSMP-Team/kalo"
  "Wiki":
    - "https://github.com/CyoriaSMP-Team/kalo/wiki"

aux_links_new_tab: true

nav_sort: case_insensitive

heading_anchors: true

search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Kalo — Open Custom Content Engine for Minecraft. <a href="https://github.com/CyoriaSMP-Team/kalo">GitHub</a> • MIT License'

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

defaults:
  - scope:
      path: ""
    values:
      layout: default
      nav_order: 1
  - scope:
      path: "getting-started"
    values:
      nav_order: 2
  - scope:
      path: "features"
    values:
      nav_order: 3
  - scope:
      path: "furniture"
    values:
      nav_order: 4
  - scope:
      path: "bedrock"
    values:
      nav_order: 5
  - scope:
      path: "configuration"
    values:
      nav_order: 6
  - scope:
      path: "paintings"
    values:
      nav_order: 7
  - scope:
      path: "music-discs"
    values:
      nav_order: 8
  - scope:
      path: "guis"
    values:
      nav_order: 9
  - scope:
      path: "migration"
    values:
      nav_order: 10
  - scope:
      path: "api"
    values:
      nav_order: 11

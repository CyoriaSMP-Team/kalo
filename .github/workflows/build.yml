name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Kalo compiles to Java 21 bytecode so one jar spans 1.21.4 to 26.2. Building on
        # both JDKs is what keeps that true: a 25-only API creeping into the source would
        # otherwise only surface on a 1.21.4 server, at a player's expense.
        java: ['21', '25']
    name: Build (Java ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Verify the jar targets Java 21
        run: |
          jar=$(ls build/libs/Kalo-*.jar)
          major=$(unzip -p "$jar" io/kalo/KaloPluginImpl.class | od -An -t u1 -j 7 -N 1 | tr -d ' ')
          echo "$jar reports class file major version $major"
          if [ "$major" != "65" ]; then
            echo "::error::Expected major 65 (Java 21); got $major. This jar will not start on Paper 1.21.4."
            exit 1
          fi

      - name: Verify embedded Nexo API targets Java 21
        run: |
          jar=$(ls build/libs/Kalo-*.jar)
          major=$(unzip -p "$jar" com/nexomc/nexo/api/NexoItems.class | od -An -t u1 -j 7 -N 1 | tr -d ' ')
          echo "Nexo API in $jar reports class file major version $major"
          if [ "$major" != "65" ]; then
            echo "::error::Expected major 65 (Java 21) for embedded Nexo API; got $major."
            exit 1
          fi
          unzip -l "$jar" | grep -q 'kotlin/Unit.class' || {
            echo "::error::Kotlin runtime missing from the unified Kalo jar"
            exit 1
          }

      - name: Verify embedded Mohist 1.20.1 entry point targets Java 17
        run: |
          jar=$(ls build/libs/Kalo-*.jar)
          major=$(unzip -p "$jar" io/kalo/mohist/MohistPlugin.class | od -An -t u1 -j 7 -N 1 | tr -d ' ')
          echo "Mohist entry point in $jar reports class file major version $major"
          if [ "$major" != "61" ]; then
            echo "::error::Expected major 61 (Java 17) for Mohist 1.20.1; got $major."
            exit 1
          fi
          unzip -p "$jar" plugin.yml | grep -q '^name: Kalo$' || {
            echo "::error::Legacy Mohist plugin.yml must identify the unified plugin as Kalo"
            exit 1
          }
          unzip -p "$jar" plugin.yml | grep -q 'main: io.kalo.mohist.MohistPlugin' || {
            echo "::error::Legacy Mohist plugin.yml is missing its Java 17 entry point"
            exit 1
          }
          unzip -p "$jar" paper-plugin.yml | grep -A2 '^provides:' | grep -q 'Nexo' || {
            echo "::error::Paper plugin descriptor must provide the Nexo identity"
            exit 1
          }

      - name: Run performance macro benchmark
        run: ./gradlew :core:performanceBenchmark --stacktrace

      - name: Upload performance report
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark
          path: core/build/reports/benchmarks/kalo-performance.txt
          if-no-files-found: error

      - name: Upload plugin jar
        if: matrix.java == '25'
        uses: actions/upload-artifact@v4
        with:
          name: Kalo
          path: build/libs/Kalo-*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java }}
          path: '**/build/reports/tests/'

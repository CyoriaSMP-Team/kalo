name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.1). Created from the current ref if missing.'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own env block is not in scope for its `if`.
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      # Minecraft 26.x requires Java 25, so the plugin targets it too.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      # The tag is the release name, but gradle.properties is what the jars are
      # named after, so a mismatch would ship a jar that contradicts its release.
      - name: Resolve and verify version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          plugin_version="$(sed -n 's/^plugin_version=//p' gradle.properties)"
          if [ "$tag" != "v$plugin_version" ]; then
            echo "::error::Tag $tag does not match plugin_version=$plugin_version (expected v$plugin_version)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$plugin_version" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --stacktrace

      # The jar has to start on the oldest server in the supported range, and only its
      # class file version can prove that. Catching it here beats a release that a 1.21.4
      # owner discovers by the plugin refusing to load.
      - name: Verify the jar targets Java 21
        run: |
          jar="build/libs/Kalo-${{ steps.version.outputs.plugin_version }}.jar"
          major=$(unzip -p "$jar" io/kalo/KaloPluginImpl.class | od -An -t u1 -j 7 -N 1 | tr -d ' ')
          if [ "$major" != "65" ]; then
            echo "::error::Expected major 65 (Java 21); got $major. This jar will not start on Paper 1.21.4."
            exit 1
          fi

      # Four channels each want release notes, and none of them should get an empty box.
      # Failing here costs a re-tag; shipping blank notes to Modrinth cannot be undone.
      - name: Extract this version's changelog
        id: changelog
        run: |
          version="${{ steps.version.outputs.plugin_version }}"
          # Exact line match, not a regex: a version contains "." and "-", which an
          # ERE would treat as metacharacters, and awk has no word-boundary escape.
          body=$(awk -v heading="## $version" '
            $0 == heading {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md)
          if [ -z "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no content under '## $version'. Rename the Unreleased section before tagging."
            exit 1
          fi
          {
            echo 'body<<KALO_EOF'
            echo "$body"
            echo KALO_EOF
          } >> "$GITHUB_OUTPUT"

      # The changelog is the point of the step above, and this is the channel most people
      # read. --generate-notes alone published a commit list and left the written notes for
      # Modrinth and Hangar only.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          printf '%s\n' "$CHANGELOG" > release-notes.md
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --generate-notes \
            --target "${{ github.sha }}" \
            build/libs/Kalo-${{ steps.version.outputs.plugin_version }}.jar

      # Modrinth and Hangar are skipped rather than failed when their secret is absent, so
      # the workflow is useful before either account exists. SpigotMC has no upload API and
      # stays manual; see docs/RELEASING.md.
      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        env:
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
          GAME_VERSIONS: ${{ vars.SUPPORTED_GAME_VERSIONS }}
          VERSION: ${{ steps.version.outputs.plugin_version }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          jar="build/libs/Kalo-$VERSION.jar"
          data=$(jq -nc \
            --arg name "$TAG" \
            --arg number "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --arg project "$MODRINTH_PROJECT" \
            --argjson versions "$GAME_VERSIONS" \
            '{name: $name, version_number: $number, changelog: $changelog,
              dependencies: [], game_versions: $versions, version_type: "release",
              loaders: ["paper", "folia"], featured: true, project_id: $project,
              file_parts: ["file"], primary_file: "file"}')
          curl --fail-with-body -sS -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=$data" \
            -F "file=@$jar"

      - name: Publish to Hangar
        if: ${{ env.HANGAR_TOKEN != '' }}
        env:
          HANGAR_SLUG: ${{ vars.HANGAR_SLUG }}
          GAME_VERSIONS: ${{ vars.SUPPORTED_GAME_VERSIONS }}
          VERSION: ${{ steps.version.outputs.plugin_version }}
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |
          jwt=$(curl --fail-with-body -sS -X POST \
            "https://hangar.papermc.io/api/v1/authenticate?apiKey=$HANGAR_TOKEN" \
            | jq -r .token)
          upload=$(jq -nc \
            --arg version "$VERSION" \
            --arg changelog "$CHANGELOG" \
            --argjson versions "$GAME_VERSIONS" \
            '{version: $version, description: $changelog, channel: "Release",
              files: [{platforms: ["PAPER"]}],
              platformDependencies: {PAPER: $versions}, pluginDependencies: {}}')
          curl --fail-with-body -sS -X POST \
            "https://hangar.papermc.io/api/v1/projects/$HANGAR_SLUG/upload" \
            -H "Authorization: $jwt" \
            -F "versionUpload=$upload;type=application/json" \
            -F "files=@build/libs/Kalo-$VERSION.jar"

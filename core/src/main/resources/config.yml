# Kalo configuration.

# An existing resource pack to build on top of, relative to plugins/Kalo/ or absolute.
#
# Most servers already ship a pack — a font, a HUD, retextured vanilla — and Kalo's output
# used to replace it, forcing a choice between custom content and everything already
# built. Point this at that pack and both end up in the generated one.
#
# Kalo's generated files win on a collision, because they are the half that has to agree
# with what the server sends clients. Language files and block states merge entry by entry
# instead, since both packs' contents belong there.
base-pack: ""

# Whether to build Bedrock output (.mcpack and the Geyser mapping).
#
#   auto   only when Geyser is running on this server — the default. A Java-only
#          server has no use for those files, and at scale that is thousands of
#          them written for nobody.
#   always build them even without Geyser here. Use this when Geyser runs as a
#          separate process, which Kalo cannot detect from inside the server.
#   never  skip Bedrock entirely.
bedrock: auto

# Optional synchronization into an EXISTING standalone Geyser directory.
# Keep this empty unless you operate Geyser in a separate process and want
# Kalo to copy its generated.mcpack and two mapping files automatically.
# The target directory must contain Geyser's config.yml and packs/ directory.
# Kalo modifies ONLY packs/kalo-generated.mcpack and custom_mappings/kalo-*.json.
# Standalone Geyser may need a restart to load changed mappings.
# bedrock: never always takes precedence over this setting.
bedrock-standalone:
  directory: ""

# Optional Rainbow-style bridge for EXISTING Java resource-pack items.
#
# First set base-pack to the Java resource-pack ZIP used by your server.
# Hold an actual custom item and run /kalo learn-held (permission
# kalo.command.learn-held), then restart the server so Geyser registers it
# during startup. Plain, condition, range_dispatch, select and legacy
# CustomModelData overrides can now be mapped to supported 2D/3D models.
# Animated textures, composite selectors and external blocks remain unfinished.
# Stored observations live in plugins/Kalo/external-items.yml and legacy-items.yml.
# With this disabled, Kalo's native output is unchanged.
external-content:
  enabled: false
  # Observe player inventories on join, item switching and inventory close.
  # New identities are saved and become active only after the next restart.
  # Off by default: scanning inventories of all players is an operator decision.
  auto-learn: false
  # Locate an existing Java Resource Pack ZIP in installed plugin data folders
  # automatically when base-pack is empty or "auto". If multiple packs are found,
  # Kalo will not guess or replace their contents. /kalo discover-packs lists
  # all valid candidates for explicit selection. No network downloads.
  auto-discover-packs: true

# Runtime performance controller.
#
# Kalo has no artificial item/block/furniture count caps. Instead it watches actual server
# pressure and backs off optional work when the host is struggling. Disable adaptive mode
# if you prefer fixed behaviour; content remains unlimited either way.
performance:
  adaptive:
    enabled: true
    tps-warning: 18.5
    tps-critical: 16.0
    heap-warning: 0.80
    heap-critical: 0.90
    # Pressure rises immediately, but must stay healthy for this many samples before Kalo
    # restores full background/cache/render budgets. This prevents rapid oscillation.
    recovery-samples: 5

# Serving the generated resource pack to players.
#
# Off by default on purpose: enabling it opens a port, and the address players need to
# reach is something only you know — a wrong value hands out a URL nobody can fetch.
pack-host:
  enabled: false

  # Port for the built-in HTTP server. Must be reachable by players, so open it in your
  # firewall and forward it if the server is behind NAT.
  port: 8163

  # The host or IP players will reach the server on. "127.0.0.1" only works for a client
  # on the same machine as the server.
  public-address: "127.0.0.1"

  # Optional full public base URL for HTTPS reverse proxies / Cloudflare Tunnel.
  # If set, Kalo sends https://hostname/<token>/pack.zip instead of http://host:port/.
  public-url: ""

  # Listener interface. Keep this on loopback if accessed only through a local proxy.
  # Legacy default listens on all interfaces, matching previous versions.
  bind-address: "0.0.0.0"

  # Optional direct publish. Kalo uploads completed packs via the private
  # Tailnet/WireGuard endpoint and only advertises after Relay confirms bytes.
  # Empty = legacy local HTTP hosting; no Relay upload.
  relay-upload-url: ""
  # Absolute path to a private bearer token file; never commit the token.
  relay-token-file: ""

  # true kicks players who decline or fail to download. Leave false unless the content is
  # essential to play — a failed download then only means missing textures, not no access.
  required: false

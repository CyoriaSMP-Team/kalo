name: Kalo
version: ${version}
main: io.kalo.mohist.MohistPlugin
api-version: '1.20'
load: POSTWORLD
author: CyoriaSMP-Team
description: Kalo's experimental Java 17 compatibility runtime for Mohist 1.20.1
commands:
  kalo:
    description: Kalo Mohist 1.20.1 pack discovery and legacy CMD export
    usage: /kalo <status|scan|catalog|learn|export>
    aliases: [kalomohist, kalom]
permissions:
  kalomohist.admin:
    description: Inspect packs and export Bedrock resources
    default: op
